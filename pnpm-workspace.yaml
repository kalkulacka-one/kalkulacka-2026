packages:
  - 'apps/*'
  - 'packages/*'
# All expected: esbuild backs Vite/Storybook, sharp backs Next's image
# optimization, and the @prisma/*/prisma trio generates the database client
# (see packages/database). Anything added here later deserves a second look.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
